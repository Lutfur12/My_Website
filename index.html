<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>আমার প্রথম ওয়েবসাইট</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            color: #333;
        }

        header {
            background-color: #4CAF50;
            color: white;
            padding: 20px;
            text-align: center;
        }

        section {
            margin: 20px;
        }

        footer {
            text-align: center;
            margin-top: 20px;
            padding: 10px;
            background-color: #333;
            color: white;
        }
    </style>
</head>
<body>
    <header>
        <h1>স্বাগতম আমার ওয়েবসাইটে!</h1>
    </header>

    <section>
        <h2>আমার সম্পর্কে</h2>
        <p>আমি একজন ওয়েব ডেভেলপার।</p>
    </section>

    <section>
        <h2>আমার প্রজেক্ট</h2>
        <p>এই সেকশনে আমার বিভিন্ন প্রজেক্ট সম্পর্কে বিস্তারিত থাকবে।</p>
    </section>
    <button onclick="showMessage()">আমাকে ক্লিক করুন</button>

<script>
    function showMessage() {
        alert("ধন্যবাদ! আপনি বাটনে ক্লিক করেছেন!");
    }
</script>

    <footer>
        <p>© ২০২৫ আমার ওয়েবসাইট</p>
    </footer>
</body>
</html>
